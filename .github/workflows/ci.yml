name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: church_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U church -d church_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://church:church@127.0.0.1:5432/church_app
      DIRECT_URL: postgresql://church:church@127.0.0.1:5432/church_app
      PAYMENTS_ENABLED: "false"
      AUTH_SECRET: ci-auth-secret-not-for-production
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      ADMIN_SEED_EMAIL: admin@todassembly.com
      ADMIN_SEED_PASSWORD: ChangeMe123!
      CRON_SECRET: local-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-local.sh
